<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web MultiSim</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-access="__ACCESS__" data-duo-model="__DUO_MODEL__">
  <header>
    <h1>Web MultiSim</h1>
    <div>
      <span id="status" role="status">Connecting…</span>
      <button type="button" id="reconnect" hidden>Reconnect</button>
    </div>
  </header>
  <form id="access" hidden>
    <input id="code" type="password" aria-label="Access key" placeholder="Access key" autocomplete="off" required>
    <button>Connect</button>
  </form>
  <nav id="devices" aria-label="Simulators"></nav>
  <main id="workspace"></main>
  <template id="device">
    <section>
      <div class="device-heading">
        <span class="platform"></span>
        <h2></h2>
        <span class="detail"></span>
      </div>
      <div class="device-body">
        <div class="stage">
          <p class="unavailable" hidden></p>
          <div class="shell">
            <canvas class="screen"></canvas>
            <img class="chrome" alt="" hidden>
          </div>
        </div>
        <aside class="rail">
          <details class="zoom">
            <summary>Zoom</summary>
            <input type="range" min="50" max="250" step="5" value="100" aria-label="Simulator zoom">
            <button class="zoom-reset" type="button">100%</button>
          </details>
          <nav class="controls" aria-label="Device controls"></nav>
          <details>
            <summary>Text</summary>
            <form class="typing">
              <input aria-label="Text to type" placeholder="Type text" maxlength="80">
              <button>Type</button>
            </form>
          </details>
        </aside>
      </div>
    </section>
  </template>
  <script type="module" src="/app.js"></script>
</body>
</html>
